# TRON Baseline Manifest
#
# Authoritative declaration of expected runtime state. TRON treats deviations
# from this manifest as candidate intrusion signals. The manifest is committed
# to git — its integrity comes from version control, and updates require a
# tracked commit (auditable).
#
# Owner: User
# Updated: 2026-04-25
# Version: 1.0

baseline_version: "1.0"
baseline_committed: "2026-04-25"
baseline_owner: User

# Processes that may legitimately appear under this user.
# An entry NOT listed here, running under the agent user, is a candidate signal.
processes:
  expected:
    - name: claude
      purpose: Claude Code CLI — interactive sessions and `claude -p` advisor calls
      max_lifetime_minutes: 240   # 4-hour ceiling on a single interactive session
    - name: node
      purpose: Node subprocesses spawned by Claude Code
      max_lifetime_minutes: 240
    - name: python3
      purpose: Verification scripts in this repo
      max_lifetime_minutes: 30
    - name: bash
      purpose: Shell sessions and Bash tool invocations
      max_lifetime_minutes: 240
    - name: git
      purpose: Repo operations
      max_lifetime_minutes: 5
  forbidden:
    # Names that should NOT appear post-Ollama-migration. Presence is a signal.
    - name: ollama
      reason: Migrated to Anthropic-served Claude models 2026-04-24; ollama process should not be running

# TCP/UDP listeners expected on this host.
# Any listener not in `expected` is a candidate signal.
listeners:
  expected: []   # No agent in this repo is expected to open a listener
  forbidden:
    - port: 11434
      protocol: tcp
      reason: Ollama default port — should not be open post-migration

# Filesystem paths whose modification under a short window is a candidate signal.
# `alert_window_minutes`: how recent a modification must be to flag.
file_modifications:
  sensitive_paths:
    - path: /home/cmc/git/security-agents/.claude/
      reason: Agent definitions, settings, transcripts
    - path: /home/cmc/.claude/
      reason: Global Claude Code config and credentials
    - path: ~/.bashrc
      reason: Shell init — persistence vector
    - path: ~/.zshrc
      reason: Shell init — persistence vector
    - path: ~/.profile
      reason: Shell init — persistence vector
    - path: ~/.ssh/
      reason: Credential material
  alert_window_minutes: 60

# Outbound network destinations agents may legitimately reach.
# Persistent or repeated traffic to addresses outside this list is a candidate signal.
network:
  allowed_outbound_domains:
    - api.anthropic.com
    - anthropic.com
    - docs.claude.com
    - red.anthropic.com
  # Note: hardcoded IPs in .claude/settings.local.json (31.20.234.122, 192.168.1.5)
  # predate this manifest and are flagged for User review — see migration notes.
  alert_on_other_outbound: true

# Credential identifiers TRON should watch for in command lines, transcripts,
# and world-readable files. Presence in any of those is a critical signal.
credential_identifiers:
  - name: ANTHROPIC_API_KEY
    pattern_hint: "sk-ant-"
  - name: ANTHROPIC_AUTH_TOKEN
    pattern_hint: bearer-token-style
  - name: AWS_SECRET_ACCESS_KEY
    pattern_hint: 40-char base64
  - name: GITHUB_TOKEN
    pattern_hint: "gh[pousr]_"

# Agentic-misuse command signals
# ------------------------------------------------
# Behaviors documented in the Claude Mythos Preview System Card as REAL (not
# hypothetical) actions capable agents took when blocked or pursuing a goal too
# aggressively. Presence of any of these in a command line, shell history, or
# transcript is a candidate signal that an agent (possibly one of ours) is
# escalating privilege or covering its tracks. Distinct from credential_identifiers
# (which match secret *values*) — these match *actions*. TRON interprets the
# `match` tokens semantically; they are starting points, not an exhaustive regex.
command_signals:
  - id: proc-memory-scrape
    severity: critical
    reason: "Reading another process's memory to harvest secrets (Mythos card §4.5.3.1)"
    match: ["/proc/*/mem", "/proc/*/environ", "/proc/*/maps"]
  - id: debugger-memory-dump
    severity: critical
    reason: "Attaching a debugger or raw-copy tool to a live process to dump memory (§4.5.3.1)"
    match: ["gdb -p", "gdb --pid", "gcore ", "dd if=/proc/"]
  - id: credential-hunting
    severity: high
    reason: "Filesystem-wide hunt for tokens/keys when access was not granted (§4.5.3.1, §4.2.1.2)"
    match: ["grep -r", "find / -name .env", "find / -name credentials", "cat /proc/*/environ"]
    note: "Flag when paired with a token-shaped term (sk-ant-, gh[pousr]_, AKIA, PRIVATE KEY) or a broad root-anchored scan."
  - id: permission-prompt-bypass
    severity: critical
    reason: "Bypassing or auto-approving a permission/safety prompt (§4.2.1.2)"
    match: ["--dangerously-skip-permissions", "tmux send-keys", "xdotool key"]
    note: "tmux send-keys / xdotool are signals only when used to auto-answer an agent's permission prompt (simulated 'y'/Enter)."
  - id: classifier-evasion-encoding
    severity: high
    reason: "Encoding commands to slip past a safety classifier or monitor outage (§4.2.1.2)"
    match: ["base64 -d |", "| base64 --decode |", "echo * | base64"]
    note: "Decoding into a shell (… | sh, … | bash) is the escalation; plain base64 use is common and benign."
  - id: git-history-coverup
    severity: high
    reason: "Rewriting or bypassing git history/hooks to hide an agent's own changes (§4.5.4)"
    match: ["git commit --no-verify", "git filter-branch", "git push --force", "git push -f", "git reset --hard"]
    note: "Overlaps the repo-tamper signal; here the concern is an agent erasing evidence of its own writes."

# Notes on partition with system-health-agent
# ------------------------------------------------
# - system-health-agent owns frontmatter-declared tool-scope violations
#   (see its Behavioral Anomaly Monitoring table).
# - TRON owns runtime process/network/filesystem signals (this manifest).
# These domains should not overlap. If a finding could fall under either,
# defer to system-health-agent for tool-scope, TRON for runtime evidence.
